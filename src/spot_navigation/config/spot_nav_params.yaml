spot_goal_navigator:
  ros__parameters:
    # Topic that spot_driver subscribes to.
    # Use "/my_spot/cmd_vel" if spot_name="my_spot" in spot_driver config.
    cmd_vel_topic: "/cmd_vel"

    # Stop when closer than this to goal (metres)
    goal_tolerance: 0.3

    # Phase 1 (ROTATING) ends when |angle_to_goal| < this (radians, ~8.6 deg)
    angle_threshold: 0.15

    # Velocity limits
    angular_speed_max: 0.5    # rad/s
    linear_speed_max: 0.4     # m/s

    # Spot body TF frame (published by spot_driver, moves with robot)
    robot_frame: "body"

    # World-fixed frame (goal stored here between keypress and arrival)
    odom_frame: "odom"

    # Control loop rate
    update_rate: 10.0    # Hz
