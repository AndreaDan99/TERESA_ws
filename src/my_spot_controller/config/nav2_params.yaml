

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: my_spot/odom 
    robot_base_frame: my_spot/body
    odom_topic: /my_spot/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    
    # DWB Local Planner
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.8
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      
      vx_samples: 20
      vth_samples: 40
      sim_time: 1.5
      
      # Scoring
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalDist"]
      BaseObstacle.scale: 0.02
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

# ⭐ SOLO LOCAL COSTMAP (NO global)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: my_spot/odom  # ← odom, non map
      robot_base_frame: my_spot/body
      use_sim_time: False
      rolling_window: true  # ← Mappa si muove con robot
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.5
      
      plugins: ["voxel_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        min_obstacle_height: 0.05
        
        # 5 telecamere Spot
        observation_sources: frontleft frontright left right back
        
        frontleft:
          topic: /spot/depth/frontleft/points
          sensor_frame: frontleft_fisheye_image
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.5
          obstacle_min_range: 0.3
        
        frontright:
          topic: /spot/depth/frontright/points
          sensor_frame: frontright_fisheye_image
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.5
          obstacle_min_range: 0.3
        
        left:
          topic: /spot/depth/left/points
          sensor_frame: left_fisheye_image
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.3
        
        right:
          topic: /spot/depth/right/points
          sensor_frame: right_fisheye_image
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.3
        
        back:
          topic: /spot/depth/back/points
          sensor_frame: back_fisheye_image
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      
      always_send_full_costmap: True

behavior_server: 
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"] 
    
    spin:
      plugin: "nav2_behaviors/Spin" 
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    
    global_frame: my_spot/odom
    robot_base_frame: my_spot/body
    transform_timeout: 0.1
    use_sim_time: False
