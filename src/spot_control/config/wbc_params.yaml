wbc_qp_controller:
  ros__parameters:
    urdf_path: ''   # auto-resolved via ament_index at runtime

    dry_run: false     # true → debug topics, no robot movement

    # TF frames
    odom_frame:      'my_spot/odom'
    body_frame:      'my_spot/body'
    z1_base_frame:   'link00'
    ee_frame:        'link06'

    # Arm-only WBC gains
    kp_ang: 1.5     # [rad/s per rad] orientamento look-at
    k_null: 0.3     # joint centering gain in null-space
    damping: 1.0e-3 # base damping (adattivo: λ * (1 + 1/m))

    # Joint velocity limit
    q_dot_max: 1.0   # [rad/s]

    # Active perception Cartesian scanning (replaces null-space joint-space grids)
    cartesian_step: 0.12          # [m] passo base Cartesian per inner ring e scan
    cartesian_step_wide: 0.20     # [m] passo Y sweep ampio (compensa rotazione Spot)

    # Timing per ACTIVE_SEARCH (SEARCHING)
    search_timeout_per_point: 1.0 # [s] data collection timeout (arm movement unlimited)

    # Timing per PERCEPTUAL_SCAN (APPROACHING)
    scan_timeout_per_point: 3.0   # [s] raccolta dati per posa in APPROACHING
    scan_adaptive_iters: 3        # max iterazioni adattive dopo griglia statica
    kp_confidence_ok: 0.4         # [0-1] soglia keypoint per considerarlo "sufficiente"
    cartesian_x_advance: 0.10    # [m] forward advance for PERCEPTUAL_SCAN grid
    pre_scan_conf_thr: 0.6       # [0-1] conf threshold for reduced grid (all 4 kp ok)

    # Goal update period — controls how often WBC recomputes IK goals.
    # IK solver processes goals sequentially (one trajectory at a time), so higher
    # rate (> traj_min_time) just keeps the latched goal fresh.
    update_period: 0.1   # [s] = 10 Hz

    # EE goal orientation: X_ee points toward target, Y_ee near home config.
    # Must match home_orientation in z1_fsm_params.yaml.
    home_orientation: [-0.0062, 0.4107, 0.0021, 0.9118]  # [qx, qy, qz, qw]

    # EE orientation computation mode:
    #   "minrot"       → minimum rotation from home X to x_ee (preserves wrist config)
    #   "gram_schmidt" → Gram-Schmidt Y_ee ∥ home Y (prevents twist, may force wrist rotation)
    orientation_mode: "minrot"

    # Workspace safety margin [m] — keep in sync with z1_fsm_params.yaml
    # Uses the same WorkspaceChecker class (z1_vision.workspace_checker).
    # EE goals are clipped to max_reach - safety_margin.
    workspace_safety_margin: 0.05

    # Topics — output to mux, not directly to z1_ik_to_jtc
    ik_goal_topic:      '/wbc/ik_goal_pose'
    ik_enable_topic:    '/wbc/ik_enable'
    joint_states_topic: '/joint_states'

wbc_coordinator:
  ros__parameters:
    # Handoff triggers when Spot body is within this distance of the approach_point [m].
    # approach_point is published by laying_human_detector at approach_distance in front
    # of the patient. Set handoff_distance to a small arrival tolerance (e.g. 0.3m).
    handoff_distance: 0.05
    soft_handoff_distance: 0.50   # [m] distance to pause for scanner completion

    # Quality monitor: fixed target (mean of first N odom measures) updated
    # only when confidence improves by >= margin. Quality from posture_confidence.
    # quality = max_q * (1 - posture_confidence), grows when confidence stops.
    confidence_margin: 0.10  # min confidence improvement to update target
    quality_growth: 0.05     # [m/s] quality increase when no confidence data
    quality_min: 0.01        # [m] floor
    quality_max: 0.20        # [m] ceiling (reduced: keeps v_scale ≥ 0.33)
    quality_buf_size: 3      # number of initial measurements to freeze target

    # Body height at handoff — lowers Spot so Z1 can reach the patient [m, offset from nominal]
    handoff_body_height: -0.15   # abbassa Spot di 15 cm al handoff
    min_body_height:     -0.20   # limite minimo di sicurezza
    max_body_height:      0.0    # altezza nominale

    # SEARCHING — ricerca adattiva coarse + refinement
    # Coarse: Spot alterna ±30° yaw, arm 7 poses per yaw; dopo entrambi: HOME + step forward 20cm, repeat.
    search_body_height: 0.0                       # [m] altezza nominale
    search_yaw_angles: [30.0, -30.0]  # degrees, relative steps
    search_step_forward: 0.30  # [m] forward step after each arm cycle
    search_step_speed: 0.5     # [m/s] forward step speed
    search_pitch_angles: [0.0, 0.087, 0.17]       # [rad] 0°, 5°, 10° — usati nel refinement
    search_refine_dwell: 4.0                      # [s] dwell per pitch durante refinement
    search_yaw_kp: 0.8                            # P-gain for yaw rotation via cmd_vel.angular.z
    search_yaw_tolerance: 0.08                    # [rad] ~4.6° tolleranza per yaw raggiunto
    search_max_angular_vel: 0.2                   # [rad/s] max angular velocity for search rotation (lento)
    search_semi_lock_dwell: 3.0                  # [s] Orbbec osserva dopo settle completato
    search_semi_lock_settle_timeout: 5.0         # [s] timeout se Spot non raggiunge il target
    search_semi_lock_yaw_tol: 0.05               # [rad] tolleranza yaw per considerare settle OK
    search_semi_lock_pitch_tol: 0.03             # [rad] tolleranza pitch per considerare settle OK
    search_lock_confidence: 0.70                   # [0-1] soglia LYING per lock
    search_lock_samples: 5                         # campioni approach_point da mediare
    search_refine_trigger_orb_conf: 0.30          # [0-1] soglia Orbbec per trigger refinement

    # PRE_APPROACH — arm pre-orientation before Spot starts walking
    pre_approach_duration: 5.0   # [s] pausa per orientare il braccio (WBC arm-only)

    # FAST body pose optimization — grid search per ogni punto
    body_grid_heights: [-0.20, -0.18, -0.15]        # [m] altezze da provare
    body_grid_pitches: [0.0, 0.087, 0.17, 0.26]    # [rad] 0°, 5°, 10°, 15°
    body_sweet_spot: [0.35, 0.0, 0.30]              # [m] centro workspace Z1 in link00
    body_settle_time: 1.5                             # [s] attesa dopo body_pose
    spot_y_penalty: 0.50                             # cost = dist + penalty * |dy_body| (0=no penalty)

    # WS_EXTENSION grid search (h, p, dx, dy) — fallback when (h,p) alone insufficient
    ws_ext_dx_steps: 5                         # number of lateral/fwd grid steps
    ws_ext_dx_max: 0.20                        # [m] max lateral displacement (±)
    ws_ext_dy_fwd_max: 0.20                    # [m] max forward displacement
    ws_ext_dy_bwd_max: 0.30                    # [m] max backward displacement
    navigator_timeout: 5.0                     # [s] max wait for Spot to reach WS_EXT goal
    ws_ext_goal_tolerance: 0.15               # [m] arrival tolerance for WS_EXT drive
    max_workspace_reach: 0.60                 # [m] Z1 arm max reach from link00 (triggers WS_EXT)
    scan_timeout: 120.0                       # [s] global timeout for SCANNING phase
    approach_timeout: 60.0                     # [s] max time for Spot to reach handoff in APPROACHING
    manual_scan_gate: true                     # true = manual step confirm between exposure→FAST

    # ── Exposure body scanning ──────────────────────────────────────
    # /exposure_scanner node parameters
    exposure_standoff: 0.50                   # [m] camera distance from body surface
    exposure_dwell: 2.0                        # [s] observation time per body point
    exposure_grid_rows: 3                      # torso grid rows
    exposure_grid_cols: 5                      # torso grid columns
    exposure_sweet_spot: [0.45, 0.0, 0.45]    # [m] camera sweet spot in link00 frame

    # Debug: step mode — gates automatic FSM transitions for debugging.
    # When true, each mission-state transition must be confirmed via /wbc/step_confirm.
    step_mode: false

    # Topics
    posture_confidence_topic: '/human_pose/posture_confidence'
    approach_point_topic:     '/laying_human/approach_point'
    body_center_topic:        '/laying_human/body_center'
    ik_done_topic:            '/ik_done'
    z1_fsm_state_topic:       '/z1_fsm/state'
    wbc_enable_topic:         '/wbc/enable'

    # ── NLF prior parameters ─────────────────────────────────────────────────
    nlf_timeout: 30.0
    nlf_coherence_threshold: 0.15
    nlf_divergence_threshold: 0.30
    nlf_excellent_confidence: 0.80
    nlf_prior_topic: '/exposure/nlf_prior'
    nlf_trigger_topic: '/nlf/trigger'

wbc_spot_navigator:
  ros__parameters:
    mode: 'approaching'       # 'approaching' (rotate→drive) or 'exposure' (P-controller X+Y)

    # Forward navigation (APPROACHING)
    goal_topic: '/wbc/spot_goal'
    goal_tolerance: 0.15
    angular_speed_max: 0.4
    linear_speed_max: 0.3
    angle_threshold: 0.08
    kp_lin: 0.5
    kp_ang: 0.8

    # Exposure navigation — matching test_exposure_poses.py
    nav_y_speed: 0.15       # [m/s] max lateral speed
    nav_y_gain: 0.3         # P-gain (speed = min(|dy|*gain, max_speed))
    nav_y_min_speed: 0.12   # [m/s] min speed, above Spot deadband (~0.10)
    nav_y_tolerance: 0.05   # [m] arrival tolerance
    nav_y_timeout: 10.0     # [s] max exposure nav time

body_pose_optimizer:
  ros__parameters:
    spot_y_penalty: 0.50   # cost = dist + penalty * |dy_body| (0=no penalty)
