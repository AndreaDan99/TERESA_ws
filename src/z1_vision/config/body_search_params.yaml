# body_search_params.yaml
# Parametri per la scansione ad arco adattiva (BodySearchScanner)
#
# La scansione muove il braccio attraverso N pose in world frame per trovare
# la posizione dalla quale il tracker YOLO vede meglio il torso.
#
# World frame (TERESA):
#   X → verso il basso (discesa braccio verso torso)
#   Y → da faccia del paziente verso gambe (asse corpo)
#   Z → laterale (da fianco dx a fianco sx)
#
# Struttura della scansione:
#   Punto 0  : home position, orientamento fisso (raccoglie stima iniziale torso)
#   Punti 1..N: arco attorno a home (ny × nz), orientamento look-at dinamico
#               verso il torso rilevato al punto 0.
#
# L'arco è definito da 4 posizioni ±Y e ±Z senza il centro (home lo copre già).
# Da angolazioni diverse si ottiene una stima 3D più accurata del centro torso
# (triangolazione multi-vista).

z1_FSM:
  ros__parameters:

    # ── Abilita/disabilita ──────────────────────────────────────────
    # Se true: all'avvio (dopo HOMING) la FSM entra in BODY_SCANNING
    # prima di aspettare il lock normale del tracker.
    # Se false: comportamento precedente (aspetta lock direttamente in WAITING).
    body_scan_on_start: true

    # ── Arco di scansione (pose del braccio in world frame) ────────
    #
    # Centro dell'arco: coincide con la home position del braccio.
    body_scan_center: [-0.09, 0.00, 0.44]    # [x, y, z] in metri

    # Semi-estensioni dell'arco:
    #   body_scan_ext_y: ±Y (spalla→fianco del paziente)
    #   body_scan_ext_z: ±Z (laterale sinistra/destra)
    # Con ny=2 e nz=2 si ottengono 4 posizioni sull'arco:
    #   (center_y ± ext_y) × (center_z ± ext_z)
    # Il centro è omesso (home lo copre come punto 0).
    body_scan_ext_y: 0.06   # [m]  offset spalla/fianco (piccolo: arco vicino a home)
    body_scan_ext_z: 0.04   # [m]  offset laterale

    # Numero di punti lungo Y e Z dell'arco (fase 1):
    # ny=2, nz=2 → 4 posizioni arco + home = 5 posizioni totali
    # Fase 2: 5 posizioni × 3Y × 3Z = 45 pose polso
    body_scan_ny: 2
    body_scan_nz: 2

    # ── Fase 1: home ────────────────────────────────────────────
    # Timeout e frame minimi per il punto home (dà più tempo per la
    # stima iniziale del torso).
    body_scan_point_timeout: 4.0   # [s]
    body_scan_min_frames:    8

    # ── Griglia angolare del polso (EE frame) ─────────────────────
    # Per ogni posizione (home in fase 1, arco in fase 2) si genera una griglia
    # di orientamenti come perturbazioni angolari nel frame EE:
    #   R_new = R_base @ Ry(alpha) @ Rz(beta)
    # dove alpha ∈ [-angle_y_deg, ..., +angle_y_deg] e beta ∈ [-angle_z_deg, ..., +angle_z_deg].
    #
    # Fase 1 (home):  R_base = home_orientation  (sweep attorno alla direzione home)
    # Fase 2 (arco):  R_base = look-at verso torso_estimate  (sweep attorno al look-at)
    #
    # Vantaggi rispetto agli offset spaziali:
    #   - Movimenti simmetrici e predicibili
    #   - Nessun flip d'asse (perturbazione locale nel frame EE)
    body_scan_wrist_ny:          3      # passi griglia lungo Y_ee (tilt su/giù) — FASE 1 (home)
    body_scan_wrist_nz:          3      # passi griglia lungo Z_ee (pan sx/dx)  — FASE 1 (home)
    body_scan_wrist_angle_y_deg: 12.0   # [deg] semi-range rotazione attorno a Y_ee
    body_scan_wrist_angle_z_deg: 12.0   # [deg] semi-range rotazione attorno a Z_ee
    body_scan_wrist_timeout:     2.0    # [s] timeout per singola pose
    body_scan_wrist_min_frames:  5      # frame minimi per pose

    # Griglia polso per le posizioni ARCO (fase 2).
    # Con 1×1 ogni posizione arco usa solo il look-at centrale (nessun sweep angolare),
    # evitando pose estreme che causano non-convergenza del JTC.
    body_scan_arc_wrist_ny:      1      # passi griglia polso arco lungo Y_ee
    body_scan_arc_wrist_nz:      1      # passi griglia polso arco lungo Z_ee

    # Score oltre il quale si interrompe la scansione anticipatamente.
    body_scan_early_stop: 0.95

    # ── Outlier rejection nella fusione finale ─────────────────────
    # Distanza massima [m] tra una stima arco e l'anchor home per essere
    # inclusa nella media pesata finale. Misure più lontane vengono scartate
    # (probabilmente detection errate o oggetti diversi).
    # Se tutte le misure arco sono outlier → usa direttamente l'anchor home.
    body_scan_fusion_max_dist: 0.15

    # ── Fase 3: posizione verso i fianchi ──────────────────────────
    # Offset in +Y (verso fianchi) rispetto al centro torso trovato in fase 2.
    # Il braccio si posiziona a [x_home, torso_y + offset, torso_z] e guarda
    # verso il torso con look-at dinamico. Da questa angolazione la camera vede
    # testa, collo, spalle e petto nella stessa inquadratura, consentendo di
    # raffinare la stima Y (distanza collo-spalle) e Z (centramento laterale).
    # Frame TERESA (home): X=laterale, Y=testa→fianchi, Z=verticale(su)
    body_scan_p3_offset_y: 0.20   # [m] offset verso fianchi (+Y, asse corpo)
    body_scan_p3_offset_z: 0.45   # [m] offset verso l'alto (+Z, verticale)


# ── Parametri scan mode nel tracker ────────────────────────────────────────
z1_yolo_torso_tracker:
  ros__parameters:

    # Numero di frame validi consecutivi per dichiarare SCAN_POINT_LOCKED
    # (stato interno del tracker in scan mode).
    scan_min_frames: 10
