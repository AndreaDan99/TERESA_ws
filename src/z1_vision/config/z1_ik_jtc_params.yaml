z1_ik_to_jtc:
  ros__parameters:

    # ── Modello robot ──────────────────────────────────────────────
    urdf_path:  ''   # auto-resolved via ament_index at runtime
    base_frame: 'world'
    ee_frame:   'link06'

    # ── Topic interface FSM ────────────────────────────────────────
    ik_goal_topic:   '/ik_goal_pose'
    ik_enable_topic: '/ik_enable'
    ik_done_topic:   '/ik_done'

    # ── IK solver (damped pseudo-inverse Jacobian) ─────────────────
    ik_max_iter:    800
    ik_tol:         5.0e-3      # ~5mm tolerance (sufficient for ultrasound)
    ik_damping:     1.0e-3
    ik_alpha:       0.8         # step size dell'integrazione (aumentato per convergenza più rapida)
    ik_rot_weight:  0.3         # basso: privilegia posizione su orientamento (più facile raggiungere pose arco)

    # ── Traiettoria JTC (smoothstep quintica) ──────────────────────
    max_joint_vel: 0.6          # [rad/s] velocità massima joint
    traj_min_time: 1.0          # [s]    durata minima traiettoria
    traj_max_time: 10.0         # [s]    durata massima traiettoria
    traj_points:   25           # numero di waypoint (>= 3)
