z1_ik_to_jtc:
  ros__parameters:

    # ── Modello robot ──────────────────────────────────────────────
    urdf_path:  ''   # auto-resolved via ament_index at runtime
    base_frame: 'world'
    ee_frame:   'link06'

    # ── Topic interface FSM ────────────────────────────────────────
    ik_goal_topic:   '/ik_goal_pose'
    ik_enable_topic: '/ik_enable'
    ik_done_topic:   '/ik_done'

    # ── IK solver (damped pseudo-inverse Jacobian) ─────────────────
    ik_max_iter:    400
    ik_tol:         1.5e-3      # meno rigido: converge anche vicino ai limiti
    ik_damping:     5.0e-4
    ik_alpha:       0.5         # step size dell'integrazione
    ik_rot_weight:  0.1         # basso: massima priorità alla posizione, poi raffineremo orientamento

    # ── Traiettoria JTC (smoothstep quintica) ──────────────────────
    max_joint_vel: 0.2          # [rad/s] velocità massima joint (ridotta per evitare vibrazioni su Spot)
    traj_min_time: 1.0          # [s]    durata minima traiettoria
    traj_max_time: 15.0         # [s]    durata massima traiettoria
    traj_points:   25           # numero di waypoint (>= 3)
