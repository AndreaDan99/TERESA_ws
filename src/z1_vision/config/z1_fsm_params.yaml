z1_FSM:
  ros__parameters:

    # ── Topic interface ────────────────────────────────────────────
    torso_locked_topic:            "/torso_target_ee_locked"
    ik_enable_topic:               "/ik_enable"
    ik_goal_topic:                 "/ik_goal_pose"
    ik_done_topic:                 "/ik_done"
    state_topic:                   "/z1_fsm/state"
    impedance_enable_topic:        "/impedance_enable"
    impedance_done_topic:          "/impedance_done"
    target_out_of_workspace_topic: "/target_out_of_workspace"
    keyboard_cmd_topic:            "/z1_keyboard_cmd"

    # ── Freshness threshold ────────────────────────────────────────
    # Massima età accettabile del messaggio su torso_locked_topic
    # per considerare il target "fresco" in WAITING
    target_max_age_s: 0.5          # [s]

    # ── Workspace checker (Pinocchio) ──────────────────────────────
    urdf_path: '/home/andrea/Ros2_repositories/unitree_z1_ws/install/z1_description/share/z1_description/urdf/z1.urdf'
    ee_frame:  'link06'

    # Margine di sicurezza dal limite massimo di raggiungibilità:
    # il robot si ferma a (max_reach - workspace_safety_margin) dalla base
    workspace_safety_margin: 0.30  # [m]

    # Posizione della base del braccio in world frame.
    # [0,0,0] se world == base frame (configurazione standard Z1 su TERESA)
    arm_base_pos: [0.0, 0.0, 0.0]  # [m]

    # ── Approccio perpendicolare (surface frame) ───────────────────
    # Il JTC porta l'EE a standoff metri dal torso con X_ee puntato verso il torso.
    #
    # approach_mode: "normal"   → standoff lungo la normale superficiale
    #                             (classico approccio frontale/ecografico)
    #                "vertical" → standoff direttamente sopra al torso,
    #                             discesa dritto in -Z world
    #                             (X_ee = [0,0,-1], punta verso il basso = verso il torso)
    surface_frame_topic:  "/torso_surface_frame"
    ik_approach_standoff: 0.070   # [m] distanza di standoff dalla superficie
    approach_mode:        "vertical"   # "normal" | "vertical"

    # ── Debug ──────────────────────────────────────────────────────
    # Se true: dopo WAIT_IK_DONE torna in WAITING senza avviare impedance.
    # Usare per verificare che il JTC allinei correttamente l'EE alla normale
    # prima di abilitare il torque controller.
    skip_impedance: false   # ← mettere false per il ciclo completo

    # ── Home position ──────────────────────────────────────────────
    # Posa cartesiana in cui il braccio va all'avvio (HOMING) e quando
    # si preme H o ESC sulla tastiera.
    #
    # Imposta questi valori in base alla geometria reale del robot.
    # home_orientation: [qx, qy, qz, qw]  (quaternione, frame world)
    #
    # Valori di default — da aggiornare con la posa di sicurezza reale:
    #home_position:    [0.1714, 0.0146, 0.5449]        # [m]  x, y, z in world frame
    #home_orientation: [-0.0155, 0.2918, 0.0748, 0.9543]  # [qx, qy, qz, qw]
    home_position:    [-0.0946, 0.0009, 0.4392]     # [m]  x, y, z in world frame
    home_orientation:  [-0.0039, 0.2911, -0.0155, 0.9566] # [qx, qy, qz, qw]