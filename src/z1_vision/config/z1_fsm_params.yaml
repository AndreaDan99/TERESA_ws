z1_FSM:
  ros__parameters:

    # ── Topic interface ────────────────────────────────────────────
    torso_locked_topic:            "/torso_target_ee_locked"
    ik_enable_topic:               "/ik_enable"
    ik_goal_topic:                 "/ik_goal_pose"
    ik_done_topic:                 "/ik_done"
    state_topic:                   "/z1_fsm/state"
    impedance_enable_topic:        "/impedance_enable"
    impedance_done_topic:          "/impedance_done"
    target_out_of_workspace_topic: "/target_out_of_workspace"
    keyboard_cmd_topic:            "/z1_keyboard_cmd"

    # ── Freshness threshold ────────────────────────────────────────
    # Massima età accettabile del messaggio su torso_locked_topic
    # per considerare il target "fresco" in WAITING
    target_max_age_s: 0.5          # [s]

    # ── Workspace checker (Pinocchio) ──────────────────────────────
    urdf_path: ''   # auto-resolved via ament_index at runtime
    ee_frame:  'link06'

    # Margine di sicurezza dal limite massimo di raggiungibilità:
    # il robot si ferma a (max_reach - workspace_safety_margin) dalla base.
    # Keep in sync with wbc_params.yaml — both use the same WorkspaceChecker class.
    workspace_safety_margin: 0.60  # [m]

    # Posizione della base del braccio in world frame.
    # [0,0,0] se world == base frame (configurazione standard Z1 su TERESA)
    arm_base_pos: [0.0, 0.0, 0.0]  # [m]

    # ── Approccio perpendicolare (surface frame) ───────────────────
    # Il JTC porta l'EE a standoff metri dal torso con X_ee puntato verso il torso.
    #
    # approach_mode: "normal"   → standoff lungo la normale superficiale
    #                             (classico approccio frontale/ecografico)
    #                "vertical" → JTC standoff in Z sopra la superficie:
    #                             pos = [torso.x + dx - clr, torso.y + dy, p_surf.z + standoff + dz]
    #                             X_ee = [0,0,-1]; impedance avanza in +X (normal=[-1,0,0])
    surface_frame_topic:  "/torso_surface_frame"
    ik_approach_standoff: 0.250   # [m] distanza di standoff dalla superficie (= desired_normal_offset)
    approach_mode:        "normal"     # "normal" | "vertical"

    # ── Modalità scansione FAST Ultrasound ────────────────────────
    # "single"          → singolo punto al centro torso
    # "fast_ultrasound" → protocollo FAST: centro hub + 4 finestre ecografiche
    #
    # World frame (TERESA):
    #   X → verso il torso  (asse di approccio, gestito da surface frame)
    #   Y → testa → piedi   (asse corpo)
    #   Z → destra → sinistra (laterale)
    #
    # I 4 punti FAST sono calcolati geometricamente dai keypoint YOLO 3D
    # (kp5=spalla lontana, kp6=spalla vicina, kp11=fianco lontano, kp12=fianco vicino)
    # al termine del body scan. I ratios sono frazioni delle dimensioni anatomiche
    # reali del paziente (adattativi). Tutti i punti vengono clippati a restare
    # dentro il bounding box torso [shoulder_mid_y, hip_mid_y].
    #
    # Sequenza: Centro(hub) → Sottoxifoidea → RUQ → LUQ → Sovrapubica
    #           Con pausa scan_pause_s al centro tra ogni punto FAST.
    scan_mode:        "fast_ultrasound"   # "single" | "fast_ultrasound"
    scan_clearance_x: 0.120              # [m] retrazione -X tra punti (SCAN_PRELIFT)
    scan_pause_s:     2.0                # [s] pausa al centro hub tra un punto FAST e l'altro

    # ── Ratios anatomici FAST ──────────────────────────────────────
    # Tutti espressi come frazioni di torso_len (lunghezza spalle→fianchi)
    # o shoulder_width (larghezza spalle), sempre ≥ 0.
    # body_ratio: frazione di torso_len dalla spalla verso i piedi
    # lat_ratio:  frazione di shoulder_width laterale (kp6=destra, kp5=sinistra)
    #
    # pt1 Sottoxifoidea: 25% torso_len sotto le spalle, linea mediana
    fast_subxiphoid_body_ratio: 0.25
    #
    # pt2 RUQ (Morrison's pouch): 40% torso_len, 50% shoulder_width verso destra (kp6)
    fast_ruq_body_ratio:        0.40
    fast_ruq_lat_ratio:         0.50
    #
    # pt3 LUQ (Koller's pouch): 35% torso_len, 60% shoulder_width verso sinistra (kp5)
    fast_luq_body_ratio:        0.35
    fast_luq_lat_ratio:         0.60
    #
    # pt4 Sovrapubica: 15% torso_len DENTRO i fianchi (hip_mid - ratio*torso_len)
    #   clippato automaticamente a non superare hip_mid_y
    fast_suprapubic_body_ratio: 0.15

    # ── Debug ──────────────────────────────────────────────────────
    # Se true: dopo WAIT_IK_DONE torna in WAITING senza avviare impedance.
    # Usare per verificare che il JTC allinei correttamente l'EE alla normale
    # prima di abilitare il torque controller.
    skip_impedance: true    # ← test normal mode: verifica solo posizionamento IK

    # ── Home position ──────────────────────────────────────────────
    # Posa cartesiana in cui il braccio va all'avvio (HOMING) e quando
    # si preme H o ESC sulla tastiera.
    #
    # Imposta questi valori in base alla geometria reale del robot.
    # home_orientation: [qx, qy, qz, qw]  (quaternione, frame world)
    #
    # Valori di default — da aggiornare con la posa di sicurezza reale:
    #home_position:    [0.1714, 0.0146, 0.5449]        # [m]  x, y, z in world frame
    #home_orientation: [-0.0155, 0.2918, 0.0748, 0.9543]  # [qx, qy, qz, qw]
    home_position:    [0.0767, 0.0006, 0.3131]     # [m]  FK della posa a 40° su Spot
    home_orientation: [-0.0062, 0.4107, 0.0021, 0.9118]  # [qx, qy, qz, qw]