# z1_yolo_torso_params.yaml
# Parametri per Z1 YOLO Torso Tracker

z1_yolo_torso_tracker:
  ros__parameters:

    # ── YOLO ──────────────────────────────────────────────────────
    model_path:   'yolo11n-pose.pt'
    conf_thr:     0.20
    max_depth:    2.0
    device:       'cpu'
    imgsz:        416

    # ── Kalman Filter ──────────────────────────────────────────────
    # Q basso = mi fido del modello (corpo fermo)
    # R alto  = non mi fido troppo di YOLO (misura rumorosa)
    kf_process_noise:  0.00005
    kf_meas_noise:     1.0
    kf_vel_damping:    0.9
