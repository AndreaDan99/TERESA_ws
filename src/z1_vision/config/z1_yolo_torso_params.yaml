# z1_yolo_torso_params.yaml
# Parametri per Z1 YOLO Torso Tracker

z1_yolo_torso_tracker:
  ros__parameters:

    # ── YOLO ──────────────────────────────────────────────────────
    model_path:   'yolo11n-pose.pt'
    conf_thr:     0.25          # alzato da 0.15: riduce keypoint rumorosi
    max_depth:    4.0
    device:       'cuda'
    imgsz:        416

    # ── Sync RGB+Depth ─────────────────────────────────────────────
    sync_slop:        0.10   # secondi tolleranza timestamp sync (default 0.05 spesso troppo stretto)
    sync_queue_size:  10

    # ── Kalman Filter ──────────────────────────────────────────────
    # Q basso = mi fido del modello (corpo fermo)
    # R alto  = non mi fido troppo di YOLO (misura rumorosa)
    kf_process_noise:  0.0001   # leggermente più alto: KF segue meglio se il torso si sposta
    kf_meas_noise:     0.5     # ridotto da 1.0: Kalman usa di più la misura YOLO
    kf_vel_damping:    0.9

    # ── Tolleranza frame persi (ESTIMATING) ────────────────────────
    # Quanti frame consecutivi senza buona rilevazione prima di tornare IDLE.
    # Evita il flickering ESTIMATING↔IDLE su singoli frame persi.
    recovery_frames:   8

    # ── Stima centro torso ─────────────────────────────────────────
    # Metodo primario:  media spalle [5,6] + fianchi [11,12]
    # Metodo fallback:  shoulder_mid + chest_offset lungo (-direzione_viso)
    #                   attivo quando i fianchi non sono rilevati (es. persona seduta)
    use_face_fallback:            true
    chest_offset_from_shoulder:   0.15   # [m] distanza shoulder_mid → centro petto

    # ── Lock state ───────────────────────────────────────────────────
    min_detection_conf:           0.6
    min_keypoints:                3
    lock_stable_frames:           20
    lock_variance_thr:            0.005
    lock_stable_checks:           5
    lock_drift_thr:               0.25
    lock_drift_frames:            5

    # ── Interpolazione ──────────────────────────────────────────────
    tracking_speed:  0.05

    # ── Scan mode ───────────────────────────────────────────────────
    scan_min_frames:  8

    # ── Guidance mode (SEARCHING: any keypoint → GUIDING) ───────────
    guidance_min_conf:       0.5      # conf minima per considerare un keypoint
    guidance_recovery_frames: 15      # frame persi prima di tornare IDLE
