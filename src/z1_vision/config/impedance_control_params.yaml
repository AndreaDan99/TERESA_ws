impedance_controller_realsense:
  ros__parameters:

    # ── Modello robot ──────────────────────────────────────────────
    urdf_path:            '/home/andrea/Ros2_repositories/unitree_z1_ws/install/z1_description/share/z1_description/urdf/z1.urdf'
    end_effector_frame:   'link06'

    # ── Rate ───────────────────────────────────────────────────────
    control_rate: 500.0         # [Hz]
    log_rate:     2.0           # [Hz]

    # ── Guadagni cartesiani (traslazione) ─────────────────────────
    # K_d_critico = 2 * sqrt(K_p * m_eff), con m_eff ≈ 4 kg per Z1
    # K_p=150 → K_d_crit≈49 | K_p=200 → K_d_crit≈57 | K_p=300 → K_d_crit≈69
    # FASE 1 (senza filtro dq): K_p moderato per forza sufficiente,
    #   K_d basso (15-25) per non amplificare rumore a 500Hz, K_i=0
    # FASE 2 (con filtro passa-basso su dq): K_p=200/300, K_d=30/50
    K_p_translation: [150.0, 150.0, 100.0]
    K_d_translation: [15.0,  15.0,  25.0]
    K_i_translation: [0.0,   0.0,   0.0]

    # ── Guadagni cartesiani (rotazione) ───────────────────────────
    # Controllo orientamento EE in spazio Cartesiano via Jacobian transpose.
    # Orientamento latched al primo tick APPROACH (dal JTC) — mantiene EE
    # perpendicolare al torso anche quando spalla/gomito si muovono.
    # Se l'EE ruota troppo durante approccio → aumenta K_p_rotation.
    # Se oscilla → aumenta K_d_rotation.
    K_p_rotation: [30.0, 30.0, 30.0]   # [Nm/rad] — conservativo per inizio test
    K_d_rotation: [3.0,  3.0,  3.0]    # [Nm·s/rad]
    K_i_rotation: [0.0,  0.0,  0.0]

    # ── Parametri generali ── TUNED ────────────────────────────────
    integral_limit: 0.02
    torque_limit:   70.0        # [Nm]
    max_step_distance: 0.1    # [m] limite sicurezza step x_desired

    # ── Avvio sicuro ───────────────────────────────────────────────
    safe_startup_duration: 2.0  # [s]

    # ── Compensazione dinamica ── TUNED ────────────────────────────
    gravity_scale_factor_j2: 1.3

    # ── Approccio lungo la normale superficie ─────────────────────
    # Formula target: p_surf + (desired_normal_offset − accum) * normal_eff
    #   accum=0   → EE al standoff (coincide con dove JTC ha lasciato il braccio)
    #   accum=max → EE a (standoff − max) = lieve contatto nella superficie
    #
    # approach_mode: "normal"   → normal_eff = normale superficiale reale (da surface_frame)
    #                "vertical" → normal_eff = [0,0,1] (world Z up), scende dritto in -Z
    #                             (deve corrispondere ad approach_mode in z1_fsm_params.yaml)
    # Regola: desired_normal_offset = ik_approach_standoff (in z1_fsm_params.yaml)
    #         max_approach_distance  = standoff + contact_depth (es. 0.200 + 0.005)
    approach_mode:          "vertical"   # "normal" | "vertical"
    use_surface_frame:      true
    desired_normal_offset:  0.070   # [m] = standoff JTC → zero errore al latch
    max_approach_distance:  0.120   # [m] standoff + 5mm contatto
    # Velocità approccio: il target avanza verso il torso a questa velocità.
    # Il braccio deve riuscire a seguire il target → se troppo veloce, il braccio
    # rimane indietro e fa uno scatto quando APPROACH finisce.
    # Regola empirica: con K_p=150 e m_eff≈4kg, ω_n≈6 rad/s → max_track ≈ 0.02-0.03 m/s
    approach_speed:         0.035   # [m/s] → ~8s per 20cm (controllato, braccio riesce a seguire)
    retract_speed:          0.10    # [m/s] → ~2s per 20cm ritorno

    # ── Hold al contatto ───────────────────────────────────────────
    hold_time: 10.0             # [s] tempo fermo prima del retract

    # ── Robustezza: singolarità e limiti articolari ─────────────────
    # manip = sqrt(det(J_pos·J_pos^T)) → 0 vicino a singolarità
    # Se manip < manip_threshold: F *= (manip/threshold)^2 (rolloff quadratico)
    manip_threshold:         0.05   # tipico Z1 in workspace: 0.1-0.5
    # Repulsione soft: attiva quando giunto entra nel margine (% del range)
    joint_limit_margin_frac: 0.10   # 10% del range articolare
    joint_limit_k:           20.0   # rigidezza repulsione [Nm/rad]

    # ── Topic interface FSM ────────────────────────────────────────
    impedance_enable_topic: '/impedance_enable'
    impedance_done_topic:   '/impedance_done'
