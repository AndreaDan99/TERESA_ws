# ============================================================
#  TERESA — docker-compose (single container, Jetson Orin)
#
#  Usage:
#    cp docker/v2/.env.template docker/v2/.env   # first time
#    docker compose -f docker/v2/docker-compose.yml build
#    docker compose -f docker/v2/docker-compose.yml run --rm teresa bash
# ============================================================

services:
  teresa:
    build:
      context: ../..
      dockerfile: docker/v2/Dockerfile
    image: teresa_ws:v2

    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1

    network_mode: host
    privileged: true
    ipc: host

    volumes:
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/ros2_ws

    shm_size: 512m
    stdin_open: true
    tty: true
